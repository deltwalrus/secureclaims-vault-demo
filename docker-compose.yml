services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: vaultadmin
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultadmin -d claims"]
      interval: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.17
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      retries: 10

  vault-setup:
    image: hashicorp/vault:1.17
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./vault-setup:/setup
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: claims
      DB_ADMIN_USER: vaultadmin
      DB_ADMIN_PASSWORD: devpassword
    entrypoint: ["/bin/sh", "/setup/setup.sh"]

  app:
    build: ./app
    ports:
      - "8000:8000"
    depends_on:
      vault-setup:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
      # The setup script prints the app token. For local dev the dev root token works fine.
      VAULT_TOKEN: dev-root-token
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: claims
      DB_SSL: disable
